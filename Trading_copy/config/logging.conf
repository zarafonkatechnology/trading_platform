[loggers]
keys=root,api,engine,copy_engine,mt4_gateway,telegram

[handlers]
keys=consoleHandler,fileHandler,rotatingFileHandler

[formatters]
keys=simpleFormatter,detailedFormatter,jsonFormatter

[logger_root]
level=INFO
handlers=consoleHandler,rotatingFileHandler

[logger_api]
level=DEBUG
handlers=consoleHandler,rotatingFileHandler
qualname=api
propagate=0

[logger_engine]
level=INFO
handlers=rotatingFileHandler
qualname=engine
propagate=0

[logger_copy_engine]
level=INFO
handlers=rotatingFileHandler
qualname=copy_engine
propagate=0

[logger_mt4_gateway]
level=INFO
handlers=rotatingFileHandler
qualname=mt4_gateway
propagate=0

[logger_telegram]
level=INFO
handlers=rotatingFileHandler
qualname=telegram
propagate=0

[handler_consoleHandler]
class=StreamHandler
level=INFO
formatter=simpleFormatter
args=(sys.stdout,)

[handler_fileHandler]
class=FileHandler
level=DEBUG
formatter=detailedFormatter
args=('logs/trading.log', 'a')

[handler_rotatingFileHandler]
class=handlers.RotatingFileHandler
level=INFO
formatter=jsonFormatter
args=('logs/trading.log', 'a', 10485760, 5)

[formatter_simpleFormatter]
format=%(asctime)s - %(name)s - %(levelname)s - %(message)s
datefmt=%Y-%m-%d %H:%M:%S

[formatter_detailedFormatter]
format=%(asctime)s - %(name)s - %(levelname)s - %(filename)s:%(lineno)d - %(message)s
datefmt=%Y-%m-%d %H:%M:%S

[formatter_jsonFormatter]
class=pythonjsonlogger.jsonlogger.JsonFormatter
format=%(asctime)s %(name)s %(levelname)s %(message)s