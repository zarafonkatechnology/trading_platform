version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: trading_postgres
    environment:
      POSTGRES_USER: trader
      POSTGRES_PASSWORD: trader_password
      POSTGRES_DB: trading_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - trading_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trader"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: trading_redis
    command: redis-server --appendonly yes --requirepass redis_password
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - trading_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # RabbitMQ
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: trading_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin_password
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - trading_network
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 5

  # API Server
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: trading_api
    environment:
      DATABASE_URL: postgresql://trader:trader_password@postgres:5432/trading_db
      REDIS_HOST: redis
      RABBITMQ_HOST: rabbitmq
    volumes:
      - ../logs:/app/logs
      - ../data:/app/data
      - C:/Users/sifer/AppData/Roaming/MetaQuotes/Terminal/Common/Files:/mt4_data
    ports:
      - "8000:8000"
      - "9090:9090"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - trading_network
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000 --workers 4

  # Trading Engine
  trading_engine:
    build:
      context: ..
      dockerfile: docker/Dockerfile.engine
    container_name: trading_engine
    environment:
      DATABASE_URL: postgresql://trader:trader_password@postgres:5432/trading_db
      REDIS_HOST: redis
      RABBITMQ_HOST: rabbitmq
    volumes:
      - ../logs:/app/logs
      - ../data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - trading_network
    command: python -m src.core.trading_engine

  # Copy Engine
  copy_engine:
    build:
      context: ..
      dockerfile: docker/Dockerfile.copy_engine
    container_name: copy_engine
    environment:
      DATABASE_URL: postgresql://trader:trader_password@postgres:5432/trading_db
      REDIS_HOST: redis
      RABBITMQ_HOST: rabbitmq
    volumes:
      - ../logs:/app/logs
      - ../data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - trading_network
    command: python -m src.core.copy_engine

networks:
  trading_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data: