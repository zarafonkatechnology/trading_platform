<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Client Login - NEXUS</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0a0e1a 0%, #1a1f3a 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #f1f5f9;
            padding: 20px;
        }
        .login-container {
            background: rgba(17, 24, 39, 0.85);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 24px;
            padding: 48px;
            width: 420px;
            max-width: 100%;
            box-shadow: 0 25px 60px rgba(0,0,0,0.5);
        }
        .login-header { text-align: center; margin-bottom: 32px; }
        .login-header h1 {
            font-size: 28px;
            font-weight: 800;
            background: linear-gradient(135deg, #00d4ff, #7b2ffc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .login-header p { color: #94a3b8; font-size: 14px; margin-top: 4px; }
        
        .form-group { margin-bottom: 20px; }
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: #94a3b8;
            margin-bottom: 6px;
        }
        .form-group input {
            width: 100%;
            padding: 14px 16px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.06);
            background: rgba(255,255,255,0.05);
            color: #f1f5f9;
            font-size: 15px;
            outline: none;
            transition: all 0.3s;
        }
        .form-group input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59,130,246,0.1);
        }
        .form-group input::placeholder { color: #64748b; }
        
        .btn-login {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(59,130,246,0.3);
        }
        .btn-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .error {
            background: rgba(239,68,68,0.12);
            border: 1px solid rgba(239,68,68,0.2);
            color: #ef4444;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 13px;
            display: none;
            margin-bottom: 16px;
        }
        .error.show { display: block; }
        
        .success {
            background: rgba(34,197,94,0.12);
            border: 1px solid rgba(34,197,94,0.2);
            color: #22c55e;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 13px;
            display: none;
            margin-bottom: 16px;
        }
        .success.show { display: block; }
        
        .register-link {
            text-align: center;
            margin-top: 16px;
            color: #94a3b8;
            font-size: 14px;
        }
        .register-link a {
            color: #3b82f6;
            text-decoration: none;
            font-weight: 500;
        }
        .register-link a:hover { text-decoration: underline; }
        
        .status {
            text-align: center;
            font-size: 13px;
            color: #64748b;
            margin-top: 16px;
        }
        
        @media (max-width: 600px) {
            .login-container { padding: 24px; }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h1>🚀 NEXUS Trading</h1>
            <p>Client Login</p>
        </div>
        
        <div id="error" class="error"></div>
        <div id="success" class="success"></div>
        
        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" placeholder="Enter your email" value="zarafonkatechnology@gmail.com" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Enter your password" value="password123" required>
            </div>
            <button type="submit" class="btn-login" id="loginBtn">Sign In</button>
        </form>
        
        <div class="register-link">
            Don't have an account? <a href="/register.html">Create one</a>
        </div>
        
        <div class="status">
            <span id="statusText">Enter credentials to login</span>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:8000/api/v1';
        
        async function handleLogin(event) {
            event.preventDefault();
            
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const errorEl = document.getElementById('error');
            const successEl = document.getElementById('success');
            const btn = document.getElementById('loginBtn');
            const statusText = document.getElementById('statusText');
            
            errorEl.className = 'error';
            successEl.className = 'success';
            
            if (!email || !password) {
                errorEl.textContent = 'Please enter email and password';
                errorEl.className = 'error show';
                return;
            }
            
            btn.disabled = true;
            btn.innerHTML = '⏳ Logging in...';
            statusText.textContent = '⏳ Logging in...';
            
            try {
                console.log('🔑 Sending login request for:', email);
                
                const formData = new URLSearchParams();
                formData.append('email', email);
                formData.append('password', password);
                
                console.log('📤 Sending data:', formData.toString());
                
                const response = await fetch(`${API_URL}/client/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                        'Accept': 'application/json'
                    },
                    body: formData.toString()
                });
                
                console.log('📊 Response status:', response.status);
                
                const data = await response.json();
                console.log('📊 Response data:', data);
                
                if (response.status === 200 && data.access_token) {
                    localStorage.setItem('client_token', data.access_token);
                    console.log('✅ Token stored:', data.access_token.substring(0, 20) + '...');
                    
                    if (data.user) {
                        localStorage.setItem('client_data', JSON.stringify(data.user));
                        localStorage.setItem('account_id', String(data.user.id));
                        console.log('✅ User data stored:', data.user);
                    }
                    
                    successEl.textContent = '✅ Login successful! Redirecting...';
                    successEl.className = 'success show';
                    statusText.textContent = '✅ Login successful!';
                    btn.innerHTML = '✅ Success';
                    
                    setTimeout(() => {
                        window.location.href = '/client_dashboard.html';
                    }, 1000);
                } else {
                    errorEl.textContent = data.detail || 'Invalid email or password';
                    errorEl.className = 'error show';
                    statusText.textContent = '❌ Login failed';
                    btn.innerHTML = 'Sign In';
                    btn.disabled = false;
                }
            } catch (error) {
                console.error('❌ Login error:', error);
                errorEl.textContent = `Connection error: ${error.message}`;
                errorEl.className = 'error show';
                statusText.textContent = '❌ Connection error';
                btn.innerHTML = 'Sign In';
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
