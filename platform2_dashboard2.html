<!DOCTYPE html>
<html>
<head>
    <title>Platform 2 - Instructor Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #0a0e27; color: #e0e0e0; padding: 20px; }
        .container { max-width: 1400px; margin: 0 auto; }
        .header { background: linear-gradient(135deg, #1a1f3a, #0a0e27); padding: 20px; border-radius: 15px; margin-bottom: 20px; text-align: center; }
        .header h1 { color: #ffd700; margin-bottom: 10px; }
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: rgba(255,255,255,0.08); border-radius: 15px; padding: 20px; text-align: center; }
        .stat-value { font-size: 32px; font-weight: bold; color: #ffd700; }
        .stat-label { font-size: 14px; opacity: 0.7; margin-top: 5px; }
        .data-table { width: 100%; border-collapse: collapse; background: rgba(0,0,0,0.3); border-radius: 15px; overflow: hidden; }
        .data-table th, .data-table td { padding: 12px; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .data-table th { background: rgba(255,215,0,0.15); color: #ffd700; }
        button { background: #ffd700; color: #0a0e27; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; margin: 20px 0; }
        button:hover { opacity: 0.9; transform: scale(1.02); }
        .progress-bar { background: rgba(255,255,255,0.2); border-radius: 10px; height: 6px; overflow: hidden; margin-top: 5px; }
        .progress-fill { background: #4caf50; height: 100%; }
        .badge-success { background: #2e7d32; padding: 2px 8px; border-radius: 20px; font-size: 11px; display: inline-block; }
        .loading { text-align: center; padding: 40px; color: #ffd700; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>📊 Platform 2 – Instructor Dashboard</h1>
        <p>Complete transparency | All data accessible | Expandable database</p>
    </div>

    <button onclick="addDemoAgent()">➕ Add Demo Agent (Test Expandability)</button>

    <div class="stats-grid" id="statsGrid">
        <div class="stat-card"><div class="stat-value" id="agentCount">-</div><div class="stat-label">Total Agents</div></div>
        <div class="stat-card"><div class="stat-value" id="totalXP">-</div><div class="stat-label">Total XP</div></div>
        <div class="stat-card"><div class="stat-value" id="totalTokens">-</div><div class="stat-label">Total Tokens</div></div>
    </div>

    <h3>🤖 Agents (Expandable – New agents auto-appear)</h3>
    <table class="data-table">
        <thead>
            <tr><th>Agent</th><th>Type</th><th>XP</th><th>Tokens</th><th>Trust Weight</th><th>Accuracy</th><th>Status</th>
        </thead>
        <tbody id="agentsBody">
            <tr><td colspan="7" class="loading">Loading agents...</td></tr>
        </tbody>
    </table>
</div>

<script>
    async function loadAgents() {
        try {
            const response = await fetch('/api/platform2/agents');
            const data = await response.json();
            
            if (data.success && data.agents && data.agents.length > 0) {
                const agents = data.agents;
                let totalXP = 0;
                let totalTokens = 0;
                let html = '';
                
                for (const agent of agents) {
                    totalXP += agent.xp_points || 0;
                    totalTokens += agent.token_balance || 0;
                    const trustPercent = ((agent.trust_weight || 0.2) * 100).toFixed(1);
                    
                    html += `<tr>
                        <td><strong>${agent.agent_name}</strong></td>
                        <td>${agent.agent_type || 'Trading Agent'}</td>
                        <td>${agent.xp_points || 0}</td>
                        <td>${agent.token_balance || 1000}</td>
                        <td>
                            ${trustPercent}%
                            <div class="progress-bar"><div class="progress-fill" style="width: ${trustPercent}%"></div></div>
                        </td>
                        <td>${agent.vote_accuracy || 0}%</td>
                        <td><span class="badge-success">Active</span></td>
                    </tr>`;
                }
                
                document.getElementById('agentsBody').innerHTML = html;
                document.getElementById('agentCount').innerText = agents.length;
                document.getElementById('totalXP').innerText = totalXP;
                document.getElementById('totalTokens').innerText = totalTokens;
            } else {
                document.getElementById('agentsBody').innerHTML = '<tr><td colspan="7">No agents found. Click "Add Demo Agent" to create one.</td></tr>';
            }
        } catch (error) {
            console.error('Error loading agents:', error);
            document.getElementById('agentsBody').innerHTML = '<tr><td colspan="7">Error loading agents. Make sure Platform 2 is running.</td></tr>';
        }
    }

    async function addDemoAgent() {
        try {
            const response = await fetch('/api/platform2/add_demo_agent', {method: 'POST'});
            const data = await response.json();
            if (data.success) {
                alert(`✅ Added ${data.agent_name}! Refresh Platform 1 to see it.`);
                loadAgents();
            } else {
                alert('Failed to add agent');
            }
        } catch (error) {
            console.error('Error adding agent:', error);
            alert('Error adding agent');
        }
    }

    // Load agents immediately
    loadAgents();
    
    // Auto-refresh every 10 seconds to sync with Platform 1
    setInterval(loadAgents, 10000);
</script>
</body>
</html>
