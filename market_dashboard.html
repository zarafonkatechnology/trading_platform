<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-Time Market Dashboard | AI Trading System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 100%);
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
            min-height: 100vh;
        }
        
        .container {
            max-width: 1600px;
            margin: 0 auto;
        }
        
        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #ffd700;
        }
        
        .header h1 {
            color: #ffd700;
            font-size: 28px;
        }
        
        .header h1 span {
            font-size: 14px;
            color: #888;
        }
        
        .status-badge {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }
        
        .status-connected {
            background: #4caf50;
            color: white;
            animation: pulse 2s infinite;
        }
        
        .status-disconnected {
            background: #f44336;
            color: white;
        }
        
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.7; }
            100% { opacity: 1; }
        }
        
        /* Account Card */
        .account-card {
            background: linear-gradient(135deg, #1a2a4a 0%, #0f3460 100%);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }
        
        .balance-box {
            text-align: center;
        }
        
        .balance-label {
            font-size: 12px;
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        
        .balance-value {
            font-size: 36px;
            font-weight: bold;
            color: #ffd700;
        }
        
        .equity-box {
            text-align: center;
        }
        
        .equity-value {
            font-size: 36px;
            font-weight: bold;
            color: #4caf50;
        }
        
        .time-box {
            text-align: right;
        }
        
        .time-value {
            font-size: 14px;
            color: #888;
        }
        
        /* Market Grid */
        .market-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .instrument-card {
            background: rgba(22, 33, 62, 0.95);
            border-radius: 12px;
            padding: 15px;
            border-left: 4px solid;
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
        }
        
        .instrument-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
        }
        
        .instrument-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        
        .instrument-name {
            font-size: 16px;
            font-weight: bold;
            color: #ffd700;
        }
        
        .instrument-change {
            font-size: 12px;
            padding: 2px 8px;
            border-radius: 12px;
        }
        
        .change-positive {
            background: #4caf50;
            color: white;
        }
        
        .change-negative {
            background: #f44336;
            color: white;
        }
        
        .instrument-price {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        
        .instrument-details {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #aaa;
        }
        
        .signal-badge {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: bold;
            margin-top: 10px;
        }
        
        .signal-buy {
            background: #4caf50;
            color: white;
        }
        
        .signal-sell {
            background: #f44336;
            color: white;
        }
        
        .signal-hold {
            background: #ff9800;
            color: white;
        }
        
        /* Trading Signals Panel */
        .signals-panel {
            background: #16213e;
            border-radius: 12px;
            padding: 20px;
            margin-top: 20px;
        }
        
        .signals-panel h3 {
            color: #ffd700;
            margin-bottom: 15px;
            border-left: 3px solid #ffd700;
            padding-left: 10px;
        }
        
        .signal-card {
            background: #0f3460;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }
        
        .signal-action {
            font-size: 20px;
            font-weight: bold;
        }
        
        .signal-confidence {
            font-size: 14px;
        }
        
        .progress-bar {
            width: 100px;
            height: 6px;
            background: #2a2a4a;
            border-radius: 3px;
            overflow: hidden;
        }
        
        .progress-fill {
            height: 100%;
            background: #ffd700;
            border-radius: 3px;
            transition: width 0.3s;
        }
        
        /* Refresh Button */
        .refresh-btn {
            background: #ffd700;
            color: #0a0e27;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            margin-bottom: 20px;
        }
        
        .refresh-btn:hover {
            opacity: 0.8;
            transform: scale(1.02);
        }
        
        /* Loading Animation */
        .loading {
            text-align: center;
            padding: 40px;
            color: #ffd700;
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .market-grid {
                grid-template-columns: 1fr;
            }
            .account-card {
                flex-direction: column;
                text-align: center;
            }
            .time-box {
                text-align: center;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>📊 REAL-TIME MARKET DASHBOARD <span>AI Trading System</span></h1>
        <div id="mt4Status" class="status-badge status-disconnected">🔴 CHECKING...</div>
    </div>
    
    <!-- Account Info -->
    <div class="account-card" id="accountInfo">
        <div class="balance-box">
            <div class="balance-label">BALANCE</div>
            <div class="balance-value" id="balance">$---</div>
        </div>
        <div class="equity-box">
            <div class="balance-label">EQUITY</div>
            <div class="equity-value" id="equity">$---</div>
        </div>
        <div class="time-box">
            <div class="balance-label">LAST UPDATE</div>
            <div class="time-value" id="lastUpdate">--:--:--</div>
        </div>
    </div>
    
    <button class="refresh-btn" onclick="refreshAll()">🔄 Refresh All Data</button>
    
    <!-- Market Prices Grid -->
    <div class="market-grid" id="marketGrid">
        <div class="loading">Loading market data...</div>
    </div>
    
    <!-- Trading Signals Panel -->
    <div class="signals-panel">
        <h3>🎯 LIVE TRADING SIGNALS</h3>
        <div id="signalsPanel">
            <div class="loading">Loading signals...</div>
        </div>
    </div>
</div>

<script>
    let autoRefreshInterval = null;
    
    // Instrument categories
    const instruments = {
        forex: ['EURUSD', 'GBPUSD', 'USDJPY', 'USDCAD', 'AUDUSD', 'NZDUSD'],
        metals: ['GOLD', 'SILVER'],
        indices: ['#NASDAQ100', '#DJ30', '#S&P500'],
        energy: ['BRENT_OIL', 'CrudeOIL']
    };
    
    // Previous prices for calculating change
    let previousPrices = {};
    
    async function fetchMarketData() {
        try {
            const response = await fetch('/api/market/dashboard_data');
            const data = await response.json();
            
            if (data.success) {
                // Update account info
                document.getElementById('balance').innerHTML = `$${data.account.balance.toFixed(2)}`;
                document.getElementById('equity').innerHTML = `$${data.account.equity.toFixed(2)}`;
                document.getElementById('lastUpdate').innerHTML = data.timestamp;
                
                // Update MT4 status
                const statusDiv = document.getElementById('mt4Status');
                if (data.mt4_connected) {
                    statusDiv.innerHTML = '🟢 MT4 CONNECTED';
                    statusDiv.className = 'status-badge status-connected';
                } else {
                    statusDiv.innerHTML = '🔴 MT4 DISCONNECTED';
                    statusDiv.className = 'status-badge status-disconnected';
                }
                
                // Update market grid
                renderMarketGrid(data.prices);
                
                // Update signals panel
                renderSignalsPanel(data.signals);
            }
        } catch (error) {
            console.error('Error fetching market data:', error);
        }
    }
    
    function renderMarketGrid(prices) {
        const grid = document.getElementById('marketGrid');
        grid.innerHTML = '';
        
        // Categories
        const categories = [
            { name: '💱 FOREX', items: ['EURUSD', 'GBPUSD', 'USDJPY', 'USDCAD', 'AUDUSD', 'NZDUSD'], type: 'forex' },
            { name: '🥇 METALS', items: ['GOLD', 'SILVER'], type: 'metal' },
            { name: '📈 INDICES', items: ['#NASDAQ100', '#DJ30', '#S&P500'], type: 'index' },
            { name: '🛢️ ENERGY', items: ['BRENT_OIL', 'CrudeOIL'], type: 'energy' }
        ];
        
        categories.forEach(category => {
            const categoryDiv = document.createElement('div');
            categoryDiv.style.gridColumn = '1 / -1';
            categoryDiv.innerHTML = `<h3 style="color: #ffd700; margin: 10px 0 5px 0;">${category.name}</h3>`;
            grid.appendChild(categoryDiv);
            
            category.items.forEach(symbol => {
                const priceData = prices[symbol];
                if (priceData && priceData.price > 0) {
                    const card = document.createElement('div');
                    card.className = 'instrument-card';
                    card.style.borderLeftColor = priceData.change >= 0 ? '#4caf50' : '#f44336';
                    
                    // Determine color class for change
                    const changeClass = priceData.change >= 0 ? 'change-positive' : 'change-negative';
                    const changeSymbol = priceData.change >= 0 ? '▲' : '▼';
                    
                    // Format price
                    let priceDisplay = '';
                    if (category.type === 'forex') {
                        priceDisplay = priceData.price.toFixed(5);
                    } else {
                        priceDisplay = `$${priceData.price.toFixed(2)}`;
                    }
                    
                    card.innerHTML = `
                        <div class="instrument-header">
                            <span class="instrument-name">${symbol}</span>
                            <span class="instrument-change ${changeClass}">${changeSymbol} ${Math.abs(priceData.change_percent).toFixed(2)}%</span>
                        </div>
                        <div class="instrument-price">${priceDisplay}</div>
                        <div class="instrument-details">
                            <span>Bid: ${priceData.bid?.toFixed(category.type === 'forex' ? 5 : 2) || '-'}</span>
                            <span>Ask: ${priceData.ask?.toFixed(category.type === 'forex' ? 5 : 2) || '-'}</span>
                            <span>Spread: ${priceData.spread?.toFixed(1) || 0}</span>
                        </div>
                        ${priceData.signal ? `<div class="signal-badge signal-${priceData.signal.toLowerCase()}">🎯 ${priceData.signal}</div>` : ''}
                    `;
                    grid.appendChild(card);
                }
            });
        });
    }
    
    function renderSignalsPanel(signals) {
        const panel = document.getElementById('signalsPanel');
        
        if (!signals || signals.length === 0) {
            panel.innerHTML = '<div style="text-align: center; padding: 20px; color: #888;">No active trading signals at this time</div>';
            return;
        }
        
        panel.innerHTML = '';
        signals.forEach(signal => {
            const signalCard = document.createElement('div');
            signalCard.className = 'signal-card';
            
            const confidencePercent = signal.confidence || 70;
            const signalClass = signal.action === 'BUY' ? 'signal-buy' : (signal.action === 'SELL' ? 'signal-sell' : 'signal-hold');
            
            signalCard.innerHTML = `
                <div>
                    <div class="instrument-name" style="font-size: 18px;">${signal.symbol}</div>
                    <div class="signal-action ${signalClass}" style="display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: 12px;">${signal.action}</div>
                </div>
                <div>
                    <div class="signal-confidence">Confidence: ${confidencePercent}%</div>
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: ${confidencePercent}%; background: ${confidencePercent >= 70 ? '#4caf50' : '#ff9800'}"></div>
                    </div>
                </div>
                <div style="font-size: 12px; color: #aaa;">
                    Entry: ${signal.entry_price?.toFixed(signal.symbol.includes('JPY') ? 3 : 5) || '-'}<br>
                    SL: ${signal.stop_loss?.toFixed(signal.symbol.includes('JPY') ? 3 : 5) || '-'}<br>
                    TP: ${signal.take_profit?.toFixed(signal.symbol.includes('JPY') ? 3 : 5) || '-'}
                </div>
                <div style="font-size: 11px; color: #ffd700;">
                    ⚡ ${signal.reason || 'AI Generated Signal'}
                </div>
            `;
            panel.appendChild(signalCard);
        });
    }
    
    async function refreshAll() {
        await fetchMarketData();
    }
    
    // Start auto-refresh (every 3 seconds for real-time)
    function startAutoRefresh() {
        if (autoRefreshInterval) clearInterval(autoRefreshInterval);
        fetchMarketData();
        autoRefreshInterval = setInterval(fetchMarketData, 3000);
    }
    
    // Initialize
    startAutoRefresh();
</script>
</body>
</html>
