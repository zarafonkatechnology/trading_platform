<!DOCTYPE html>
<html>
<head>
    <title>Agent Performance Dashboard</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0e27; color: #e0e0e0; font-family: 'Segoe UI', sans-serif; padding: 20px; }
        .container { max-width: 1400px; margin: 0 auto; }
        h1 { color: #ffd700; border-bottom: 2px solid #ffd700; padding-bottom: 10px; margin-bottom: 20px; }
        .stats-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 15px; margin-bottom: 30px; }
        .stat-card { background: #16213e; padding: 20px; border-radius: 12px; text-align: center; }
        .stat-value { font-size: 28px; font-weight: bold; color: #ffd700; }
        .stat-label { font-size: 12px; color: #888; margin-top: 5px; }
        
        .agent-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px; margin-bottom: 30px; }
        .agent-card { background: #16213e; border-radius: 12px; padding: 15px; transition: all 0.2s; }
        .agent-card:hover { transform: translateY(-2px); background: #1a1f3a; }
        .agent-name { font-size: 18px; font-weight: bold; color: #ffd700; }
        .agent-type { font-size: 11px; color: #888; margin-bottom: 10px; }
        .metrics { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 10px 0; }
        .metric { text-align: center; }
        .metric-value { font-size: 20px; font-weight: bold; }
        .metric-label { font-size: 10px; color: #888; }
        .win-high { color: #4caf50; }
        .win-medium { color: #ff9800; }
        .win-low { color: #f44336; }
        .progress-bar { height: 4px; background: #2a2a4a; border-radius: 2px; margin: 8px 0; overflow: hidden; }
        .progress-fill { height: 100%; background: #ffd700; border-radius: 2px; transition: width 0.5s; }
        
        .leaderboard { background: #16213e; border-radius: 12px; padding: 20px; margin-bottom: 30px; }
        .leaderboard table { width: 100%; border-collapse: collapse; }
        .leaderboard th, .leaderboard td { padding: 12px; text-align: left; border-bottom: 1px solid #2a2a4a; }
        .leaderboard th { color: #ffd700; }
        .leaderboard tr:hover { background: #1a1f3a; }
        .rank-1 { color: #ffd700; font-weight: bold; }
        .rank-2 { color: #c0c0c0; }
        .rank-3 { color: #cd7f32; }
        
        button { background: #ffd700; color: #0a0e27; border: none; padding: 8px 16px; border-radius: 5px; cursor: pointer; margin: 5px; }
        .refresh-btn { background: #2196f3; color: white; }
        .auto-refresh { font-size: 12px; color: #888; margin-left: 10px; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
        .live { animation: pulse 1s infinite; }
    </style>
</head>
<body>
<div class="container">
    <h1>📊 Agent Performance Dashboard</h1>
    <p>Real-time metrics for all trading agents | Auto-refresh every 5 seconds</p>
    
    <div style="margin-bottom: 20px;">
        <button onclick="refreshData()" class="refresh-btn">🔄 Refresh Now</button>
        <button onclick="toggleAutoRefresh()" id="autoBtn">⏸️ Stop Auto-Refresh</button>
        <span class="auto-refresh" id="autoStatus">🟢 Live updates active</span>
    </div>
    
    <div class="stats-grid" id="summaryStats"></div>
    
    <div class="leaderboard">
        <h2>🏆 Agent Leaderboard</h2>
        <div id="leaderboard"></div>
    </div>
    
    <h2>🤖 All Agents</h2>
    <div class="agent-grid" id="agentsGrid"></div>
</div>

<script>
    let autoRefresh = true;
    let refreshInterval = null;
    
    function getWinClass(winRate) {
        if (winRate >= 60) return 'win-high';
        if (winRate >= 45) return 'win-medium';
        return 'win-low';
    }
    
    async function refreshData() {
        try {
            // Fetch summary
            const summaryRes = await fetch('/api/performance/summary');
            const summaryData = await summaryRes.json();
            
            if (summaryData.success) {
                const s = summaryData.summary;
                document.getElementById('summaryStats').innerHTML = `
                    <div class="stat-card"><div class="stat-value">${s.total_agents || 0}</div><div class="stat-label">Total Agents</div></div>
                    <div class="stat-card"><div class="stat-value">${s.total_xp?.toLocaleString() || 0}</div><div class="stat-label">Total XP</div></div>
                    <div class="stat-card"><div class="stat-value">${s.total_votes || 0}</div><div class="stat-label">Total Votes</div></div>
                    <div class="stat-card"><div class="stat-value">${s.overall_win_rate || 0}%</div><div class="stat-label">Overall Win Rate</div></div>
                    <div class="stat-card"><div class="stat-value">${s.best_agent || 'N/A'}</div><div class="stat-label">Best Agent</div></div>
                `;
            }
            
            // Fetch leaderboard
            const leaderboardRes = await fetch('/api/performance/leaderboard?sort_by=performance_score&limit=10');
            const leaderboardData = await leaderboardRes.json();
            
            if (leaderboardData.success) {
                let leaderHtml = '<table><thead><tr><th>Rank</th><th>Agent</th><th>Score</th><th>Win Rate</th><th>XP</th><th>Confidence</th></tr></thead><tbody>';
                leaderboardData.leaderboard.forEach((agent, idx) => {
                    let rankClass = '';
                    if (idx === 0) rankClass = 'rank-1';
                    else if (idx === 1) rankClass = 'rank-2';
                    else if (idx === 2) rankClass = 'rank-3';
                    leaderHtml += `
                        <tr>
                            <td class="${rankClass}">${idx + 1}</td>
                            <td><strong>${agent.name}</strong></td>
                            <td>${agent.performance_score}%</td>
                            <td class="${getWinClass(agent.win_rate)}">${agent.win_rate}%</td>
                            <td>${agent.xp_points.toLocaleString()}</td>
                            <td>${agent.avg_confidence}%</td>
                        </tr>
                    `;
                });
                leaderHtml += '</tbody></table>';
                document.getElementById('leaderboard').innerHTML = leaderHtml;
            }
            
            // Fetch all agents
            const agentsRes = await fetch('/api/performance/agents');
            const agentsData = await agentsRes.json();
            
            if (agentsData.success) {
                let agentsHtml = '';
                for (const [name, agent] of Object.entries(agentsData.agents)) {
                    const winClass = getWinClass(agent.win_rate);
                    const perfScore = agent.performance_score;
                    agentsHtml += `
                        <div class="agent-card">
                            <div class="agent-name">${agent.name}</div>
                            <div class="agent-type">${agent.type}</div>
                            <div class="progress-bar"><div class="progress-fill" style="width: ${perfScore}%"></div></div>
                            <div class="metrics">
                                <div class="metric"><div class="metric-value ${winClass}">${agent.win_rate}%</div><div class="metric-label">Win Rate</div></div>
                                <div class="metric"><div class="metric-value">${agent.avg_confidence}%</div><div class="metric-label">Confidence</div></div>
                                <div class="metric"><div class="metric-value">${agent.xp_points.toLocaleString()}</div><div class="metric-label">XP</div></div>
                                <div class="metric"><div class="metric-value">${agent.token_balance.toLocaleString()}</div><div class="metric-label">Tokens</div></div>
                            </div>
                            <div><small>Last vote: ${agent.last_vote} (${agent.last_confidence}%)</small></div>
                            <div><small>Knowledge: ${agent.knowledge_shared} lessons</small></div>
                        </div>
                    `;
                }
                document.getElementById('agentsGrid').innerHTML = agentsHtml;
            }
        } catch(e) {
            console.error('Error refreshing data:', e);
        }
    }
    
    function toggleAutoRefresh() {
        autoRefresh = !autoRefresh;
        const btn = document.getElementById('autoBtn');
        const status = document.getElementById('autoStatus');
        
        if (autoRefresh) {
            btn.innerHTML = '⏸️ Stop Auto-Refresh';
            status.innerHTML = '🟢 Live updates active';
            status.style.color = '#4caf50';
            startAutoRefresh();
        } else {
            btn.innerHTML = '▶️ Start Auto-Refresh';
            status.innerHTML = '⏹️ Updates paused';
            status.style.color = '#888';
            if (refreshInterval) {
                clearInterval(refreshInterval);
                refreshInterval = null;
            }
        }
    }
    
    function startAutoRefresh() {
        if (refreshInterval) clearInterval(refreshInterval);
        refreshInterval = setInterval(() => {
            if (autoRefresh) refreshData();
        }, 5000);
    }
    
    // Initial load
    refreshData();
    startAutoRefresh();
</script>
</body>
</html>
